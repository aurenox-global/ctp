<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="mobile-web-app-capable" content="yes" />
	<title>⚡ Calculadora de Planta</title>
	<meta name="description" content="Calcula qué equipos puedes conectar a tu planta eléctrica" />
	<style>
		:root {
			--bg-gradient: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
			--glass-bg: rgba(255, 255, 255, 0.05);
			--glass-border: rgba(255, 255, 255, 0.1);
			--glass-highlight: rgba(255, 255, 255, 0.15);
			--text: #ffffff;
			--text-muted: rgba(255, 255, 255, 0.6);
			--primary: #00f2ff;
			--primary-glow: 0 0 15px rgba(0, 242, 255, 0.5);
			--danger: #ff0055;
			--warn: #ffcc00;
			--ok: #00ff9d;
			--shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
			--radius: 16px;
		}
		[data-theme="light"] {
			--bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
			--glass-bg: rgba(255, 255, 255, 0.6);
			--glass-border: rgba(255, 255, 255, 0.4);
			--glass-highlight: rgba(255, 255, 255, 0.8);
			--text: #2d3436;
			--text-muted: rgba(45, 52, 54, 0.6);
			--primary: #6c5ce7;
			--primary-glow: 0 0 15px rgba(108, 92, 231, 0.3);
			--danger: #ff7675;
			--warn: #fdcb6e;
			--ok: #00b894;
			--shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
		}

		* { 
			box-sizing: border-box; 
			margin: 0; 
			padding: 0;
			-webkit-tap-highlight-color: transparent;
		}
		
		body {
			font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
			background: var(--bg-gradient);
			background-attachment: fixed;
			color: var(--text);
			line-height: 1.6;
			padding-bottom: 180px;
			min-height: 100vh;
			overflow-x: hidden;
		}

		/* Background Orbs */
		.orb {
			position: fixed;
			border-radius: 50%;
			filter: blur(80px);
			z-index: -1;
			animation: float 10s infinite ease-in-out alternate;
		}
		.orb-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: var(--primary); opacity: 0.2; }
		.orb-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: var(--danger); opacity: 0.15; animation-delay: -5s; }

		@keyframes float {
			0% { transform: translate(0, 0); }
			100% { transform: translate(30px, 50px); }
		}

		/* Header */
		header {
			background: rgba(255, 255, 255, 0.02);
			backdrop-filter: blur(16px);
			-webkit-backdrop-filter: blur(16px);
			border-bottom: 1px solid var(--glass-border);
			padding: 15px 20px;
			position: sticky;
			top: 0;
			z-index: 100;
		}
		.header-content {
			display: flex;
			align-items: center;
			gap: 15px;
			max-width: 800px;
			margin: 0 auto;
		}
		.title {
			font-size: 20px;
			font-weight: 700;
			flex: 1;
			background: linear-gradient(to right, var(--primary), var(--ok));
			-webkit-background-clip: text;
			background-clip: text;
			-webkit-text-fill-color: transparent;
			letter-spacing: 0.5px;
		}
		.btn {
			padding: 10px 16px;
			border: 1px solid var(--glass-border);
			background: var(--glass-bg);
			color: var(--text);
			border-radius: 12px;
			cursor: pointer;
			font-size: 18px;
			transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
			backdrop-filter: blur(4px);
		}
		.btn:hover {
			background: var(--glass-highlight);
			transform: translateY(-2px);
			box-shadow: 0 5px 15px rgba(0,0,0,0.1);
		}
		.btn:active { transform: scale(0.95); }
		.btn.primary {
			background: var(--primary);
			color: #000;
			border: none;
			font-weight: 600;
			box-shadow: var(--primary-glow);
		}
		.btn.primary:hover {
			filter: brightness(1.1);
		}

		/* Main */
		main {
			padding: 20px;
			max-width: 800px;
			margin: 0 auto;
		}
		.card {
			background: var(--glass-bg);
			backdrop-filter: blur(16px);
			-webkit-backdrop-filter: blur(16px);
			border: 1px solid var(--glass-border);
			border-radius: var(--radius);
			padding: 20px;
			margin-bottom: 20px;
			box-shadow: var(--shadow);
			transition: transform 0.3s;
		}
		.card:hover {
			border-color: var(--primary);
		}
		.card-title {
			font-size: 18px;
			font-weight: 700;
			margin-bottom: 15px;
			display: flex;
			align-items: center;
			gap: 10px;
			color: var(--primary);
			text-transform: uppercase;
			letter-spacing: 1px;
		}

		/* Inputs */
		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
			gap: 15px;
		}
		.field {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}
		.field label {
			font-size: 14px;
			font-weight: 600;
			color: var(--text-muted);
		}
		input, select {
			padding: 12px 16px;
			border: 1px solid var(--glass-border);
			border-radius: 12px;
			background-color: rgba(0, 0, 0, 0.2);
			color: var(--text);
			font-size: 16px;
			width: 100%;
			transition: all 0.3s;
			font-family: inherit;
		}
		select {
			appearance: none;
			-webkit-appearance: none;
			background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
			background-repeat: no-repeat;
			background-position: right 1rem center;
			background-size: 1em;
			padding-right: 2.5rem;
		}
		[data-theme="light"] input, 
		[data-theme="light"] select {
			background-color: rgba(255, 255, 255, 0.5);
		}
		[data-theme="light"] select {
			background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232d3436' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
		}
		input:focus, select:focus {
			outline: none;
			border-color: var(--primary);
			box-shadow: var(--primary-glow);
			background-color: rgba(0, 0, 0, 0.3);
		}
		.field .help {
			font-size: 12px;
			color: var(--text-muted);
		}

		/* Profiles */
		.profiles {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
			gap: 10px;
		}
		.profiles .btn {
			font-size: 14px;
			width: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 6px;
		}

		/* Devices */
		.device-group { margin-bottom: 25px; }
		.group-title {
			font-size: 16px;
			font-weight: 600;
			margin-bottom: 12px;
			padding: 8px 12px;
			background: rgba(255, 255, 255, 0.05);
			border-radius: 8px;
			display: inline-block;
			color: var(--text);
		}
		.device-list {
			display: flex;
			flex-direction: column;
			gap: 12px;
		}
		.device-row {
			background: rgba(255, 255, 255, 0.03);
			border: 1px solid var(--glass-border);
			border-radius: 12px;
			padding: 15px;
			transition: all 0.3s;
		}
		.device-row:hover {
			background: rgba(255, 255, 255, 0.08);
			transform: translateX(5px);
		}
		.device-header {
			display: flex;
			align-items: center;
			gap: 15px;
			margin-bottom: 12px;
		}
		.device-icon {
			font-size: 28px;
			width: 48px;
			height: 48px;
			display: flex;
			align-items: center;
			justify-content: center;
			background: rgba(255, 255, 255, 0.1);
			border-radius: 50%;
		}
		.device-info { flex: 1; }
		.device-name {
			font-weight: 600;
			font-size: 16px;
			margin-bottom: 4px;
		}
		.device-power {
			font-size: 12px;
			color: var(--text-muted);
		}
		.device-total {
			font-weight: 700;
			color: var(--primary);
			font-size: 18px;
			text-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
		}
		.device-controls {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
		}
		.device-controls > select {
			flex: 1 1 140px;
			min-width: 0;
		}
		.control-row {
			flex: 2 1 200px;
			display: flex;
			gap: 10px;
		}
		.control-row > input {
			flex: 1;
			min-width: 80px;
		}

		/* Footer */
		footer {
			position: fixed;
			bottom: 20px;
			left: 20px;
			right: 20px;
			max-width: 760px;
			margin: 0 auto;
			background: rgba(20, 20, 30, 0.85);
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			border: 1px solid var(--glass-border);
			border-radius: 20px;
			padding: 15px 25px;
			box-shadow: 0 10px 40px rgba(0,0,0,0.5);
			z-index: 200;
		}
		[data-theme="light"] footer {
			background: rgba(255, 255, 255, 0.85);
		}
		.footer-content {
			display: grid;
			grid-template-columns: 1.5fr 1fr 1fr 1fr;
			gap: 20px;
			align-items: center;
		}
		@media (max-width: 600px) {
			.footer-content { grid-template-columns: 1fr 1fr; gap: 15px; }
		}
		.summary-item { display: flex; flex-direction: column; gap: 2px; }
		.summary-label {
			font-size: 10px;
			color: var(--text-muted);
			text-transform: uppercase;
			letter-spacing: 1px;
			font-weight: 700;
		}
		.summary-value {
			font-size: 20px;
			font-weight: 700;
		}
		.summary-value.ok { color: var(--ok); text-shadow: 0 0 10px rgba(0, 255, 157, 0.3); }
		.summary-value.warn { color: var(--warn); text-shadow: 0 0 10px rgba(255, 204, 0, 0.3); }
		.summary-value.danger { color: var(--danger); text-shadow: 0 0 10px rgba(255, 77, 77, 0.3); }

		.progress-bar {
			height: 6px;
			background: rgba(255, 255, 255, 0.1);
			border-radius: 10px;
			overflow: hidden;
			margin-top: 5px;
		}
		.progress-fill {
			height: 100%;
			background: var(--ok);
			box-shadow: 0 0 10px var(--ok);
			transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s;
		}
		.progress-fill.warn { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
		.progress-fill.danger { background: var(--danger); box-shadow: 0 0 10px var(--danger); }

		/* Toast */
		.toast {
			position: fixed;
			top: 90px;
			left: 50%;
			transform: translateX(-50%);
			background: rgba(0, 0, 0, 0.8);
			color: white;
			border: 1px solid var(--primary);
			box-shadow: 0 10px 30px rgba(0,0,0,0.5);
			backdrop-filter: blur(10px);
			border-radius: 50px;
			padding: 12px 24px;
			font-weight: 600;
			z-index: 200;
			opacity: 0;
			transition: opacity 0.3s;
			pointer-events: none;
		}
		.toast.show {
			opacity: 1;
		}

		/* Animaciones */
		@keyframes slideIn {
			from { opacity: 0; transform: translateY(20px); }
			to { opacity: 1; transform: translateY(0); }
		}
		.device-row { animation: slideIn 0.4s ease-out backwards; }
		
		.empty-state {
			text-align: center;
			padding: 30px;
			color: var(--text-muted);
			font-style: italic;
		}
		.delete-btn {
			background: rgba(255, 0, 85, 0.1);
			color: var(--danger);
			border: 1px solid var(--danger);
			width: 36px;
			height: 36px;
			border-radius: 8px;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			transition: all 0.2s;
		}
		.delete-btn:hover {
			background: var(--danger);
			color: white;
		}
		.compact-row {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 10px;
		}
		.compact-info {
			flex: 1;
			display: flex;
			flex-direction: column;
		}
		.compact-name { font-weight: 600; font-size: 15px; }
		.compact-details { font-size: 12px; color: var(--text-muted); }
		.compact-controls {
			display: flex;
			align-items: center;
			gap: 8px;
		}
		.compact-input {
			width: 60px !important;
			padding: 8px !important;
			text-align: center;
		}
	</style>
</head>
<body>
	<div class="orb orb-1"></div>
	<div class="orb orb-2"></div>
	<header>
		<div class="header-content">
			<div class="title">⚡ Calculadora de Planta</div>
			<button id="themeBtn" class="btn">🌓</button>
			<button id="resetBtn" class="btn">🔄</button>
		</div>
	</header>

	<main>
		<!-- Configuración de la Planta -->
		<div class="card">
			<div class="card-title">
				<span class="emoji">⚙️</span>
				Configuración
			</div>
			<div class="grid">
				<div class="field">
					<label>💪 Potencia de la Planta (Watts)</label>
					<input type="number" id="plantPower" min="0" placeholder="600" inputmode="numeric" />
					<span class="help">¿Cuántos Watts puede dar tu planta?</span>
				</div>
				<div class="field">
					<label>🔋 Energía Disponible (Wh)</label>
					<input type="number" id="energyWh" min="0" placeholder="2000" inputmode="numeric" />
					<span class="help">Watts-hora disponibles</span>
				</div>
				<div class="field">
					<label>🛡️ Margen de Seguridad (%)</label>
					<input type="number" id="safety" min="50" max="100" value="80" inputmode="numeric" />
					<span class="help">Recomendado: 80%</span>
				</div>
			</div>
		</div>

		<!-- Perfiles Rápidos -->
		<div class="card">
			<div class="card-title">
				<span class="emoji">⚡</span>
				Perfiles Rápidos
			</div>
			<div class="profiles">
				<button class="btn primary" id="profileBasic">🏠 Básico (Luces + Router)</button>
				<button class="btn primary" id="profileHome">🏡 Casa (Nevera + Electrónicos)</button>
				<button class="btn" id="profileClear">🧹 Limpiar Todo</button>
			</div>
		</div>

		<!-- Agregar Equipo -->
		<div class="card">
			<div class="card-title">
				<span class="emoji">➕</span>
				Agregar Equipo
			</div>
			<div class="add-form">
				<div class="field">
					<label>Tipo de Equipo</label>
					<select id="newDeviceType">
						<option value="">Seleccionar...</option>
						<option value="custom">✨ Personalizado</option>
					</select>
				</div>
				<div class="grid" style="margin-top: 15px;">
					<div class="field">
						<label>Nombre</label>
						<input type="text" id="newDeviceName" placeholder="Ej. TV Sala" />
					</div>
					<div class="field">
						<label>Potencia (W)</label>
						<input type="number" id="newDeviceWatts" placeholder="0" />
					</div>
					<div class="field">
						<label>&nbsp;</label>
						<button id="addDeviceBtn" class="btn primary" style="width: 100%">Agregar</button>
					</div>
				</div>
			</div>
		</div>

		<!-- Lista de Equipos -->
		<div class="card">
			<div class="card-title">
				<span class="emoji">📋</span>
				Mis Equipos
			</div>
			<div id="deviceList" class="device-list">
				<div class="empty-state">No hay equipos agregados</div>
			</div>
		</div>
	</main>

	<footer>
		<div class="footer-content">
			<div class="summary-item">
				<div class="summary-label">Potencia Usada</div>
				<div class="summary-value" id="powerUsed">0 W</div>
				<div class="progress-bar">
					<div class="progress-fill" id="powerBar"></div>
				</div>
			</div>
			<div class="summary-item">
				<div class="summary-label">Disponible</div>
				<div class="summary-value" id="powerAvailable">0 W</div>
			</div>
			<div class="summary-item">
				<div class="summary-label">⏱️ Tiempo</div>
				<div class="summary-value" id="timeEstimate">-- h</div>
			</div>
			<div class="summary-item">
				<div class="summary-label">Estado</div>
				<div class="summary-value ok" id="status">✅ OK</div>
			</div>
		</div>
	</footer>

	<div class="toast" id="toast"></div>

	<script>
		// Datos de dispositivos
		const DEVICES = [
			{
				group: '💡 Iluminación',
				items: [
					{ id: 'led', icon: '💡', name: 'Bombillo LED', watts: [5, 10, 15], showTime: true },
					{ id: 'tubo', icon: '🔦', name: 'Tubo LED', watts: [15, 20, 30], showTime: true },
					{ id: 'foco', icon: '🌟', name: 'Foco Exterior', watts: [20, 30, 50], showTime: true }
				]
			},
			{
				group: '🌡️ Clima',
				items: [
					{ id: 'fan', icon: '🌀', name: 'Ventilador', watts: [30, 50, 75], showTime: true },
					{ id: 'ac', icon: '❄️', name: 'Aire Acondicionado', watts: [800, 1200, 1800], showTime: true }
				]
			},
			{
				group: '🍳 Cocina',
				items: [
					{ id: 'fridge', icon: '🧊', name: 'Nevera', watts: [100, 150, 250], showTime: true },
					{ id: 'micro', icon: '📦', name: 'Microondas', watts: [800, 1000, 1200], showTime: true },
					{ id: 'coffee', icon: '☕', name: 'Cafetera', watts: [800, 1000, 1500], showTime: true },
					{ id: 'blender', icon: '🥤', name: 'Licuadora', watts: [300, 500, 800], showTime: true }
				]
			},
			{
				group: '💻 Electrónicos',
				items: [
					{ id: 'tv', icon: '📺', name: 'Televisor', watts: [60, 100, 150], showTime: true },
					{ id: 'laptop', icon: '💻', name: 'Laptop', watts: [45, 65, 90], showTime: true },
					{ id: 'pc', icon: '🖥️', name: 'Computadora', watts: [150, 250, 400], showTime: true },
					{ id: 'router', icon: '📡', name: 'Router WiFi', watts: [8, 12, 20], showTime: true },
					{ id: 'phone', icon: '📱', name: 'Cargador', watts: [5, 10, 18], showTime: true }
				]
			},
			{
				group: '🧹 Limpieza',
				items: [
					{ id: 'washer', icon: '🧺', name: 'Lavadora', watts: [400, 600, 900], showTime: true },
					{ id: 'vacuum', icon: '🧹', name: 'Aspiradora', watts: [600, 900, 1400], showTime: true },
					{ id: 'iron', icon: '👕', name: 'Plancha', watts: [1000, 1500, 2000], showTime: true }
				]
			},
			{
				group: '💧 Otros',
				items: [
					{ id: 'pump', icon: '⚙️', name: 'Bomba de Agua', watts: [300, 500, 800], showTime: true },
					{ id: 'fan2', icon: '🌬️', name: 'Extractor', watts: [25, 40, 60], showTime: true }
				]
			}
		];

		// Estado
		let state = {
			plantPower: 600,
			energyWh: 0,
			safety: 80,
			devices: [] // Array of objects: { id, name, watts, qty, hours }
		};

		// Elementos
		const el = {
			plantPower: document.getElementById('plantPower'),
			energyWh: document.getElementById('energyWh'),
			safety: document.getElementById('safety'),
			deviceList: document.getElementById('deviceList'),
			newDeviceType: document.getElementById('newDeviceType'),
			newDeviceName: document.getElementById('newDeviceName'),
			newDeviceWatts: document.getElementById('newDeviceWatts'),
			addDeviceBtn: document.getElementById('addDeviceBtn'),
			powerUsed: document.getElementById('powerUsed'),
			powerAvailable: document.getElementById('powerAvailable'),
			timeEstimate: document.getElementById('timeEstimate'),
			status: document.getElementById('status'),
			powerBar: document.getElementById('powerBar'),
			toast: document.getElementById('toast')
		};

		// Toast notification
		function showToast(message) {
			el.toast.textContent = message;
			el.toast.classList.add('show');
			setTimeout(() => {
				el.toast.classList.remove('show');
			}, 2000);
		}

		// Cargar estado
		function loadState() {
			try {
				const saved = localStorage.getItem('plantCalc_v2');
				if (saved) state = JSON.parse(saved);
				// Migration from old version if needed, or just reset
				if (!Array.isArray(state.devices)) state.devices = [];
			} catch (e) {
				state.devices = [];
			}
		}

		// Guardar estado
		function saveState() {
			localStorage.setItem('plantCalc_v2', JSON.stringify(state));
		}

		// Tema
		function toggleTheme() {
			const current = document.documentElement.getAttribute('data-theme') || 'light';
			const next = current === 'light' ? 'dark' : 'light';
			document.documentElement.setAttribute('data-theme', next);
			localStorage.setItem('theme', next);
			showToast(next === 'dark' ? '🌙 Modo oscuro' : '☀️ Modo claro');
		}

		function loadTheme() {
			const theme = localStorage.getItem('theme') || 'light';
			document.documentElement.setAttribute('data-theme', theme);
		}

		// Inicializar Select
		function initSelect() {
			DEVICES.forEach(group => {
				const optgroup = document.createElement('optgroup');
				optgroup.label = group.group;
				group.items.forEach(item => {
					const option = document.createElement('option');
					option.value = item.id;
					option.textContent = `${item.icon} ${item.name}`;
					option.dataset.watts = item.watts[1]; // Use medium value as default
					option.dataset.name = item.name;
					optgroup.appendChild(option);
				});
				el.newDeviceType.appendChild(optgroup);
			});

			el.newDeviceType.addEventListener('change', (e) => {
				const selected = e.target.selectedOptions[0];
				if (selected && selected.value !== 'custom' && selected.value !== '') {
					el.newDeviceName.value = selected.dataset.name;
					el.newDeviceWatts.value = selected.dataset.watts;
				} else if (selected.value === 'custom') {
					el.newDeviceName.value = '';
					el.newDeviceWatts.value = '';
					el.newDeviceName.focus();
				}
			});
		}

		// Agregar Dispositivo
		function addDevice() {
			const name = el.newDeviceName.value.trim();
			const watts = parseInt(el.newDeviceWatts.value);

			if (!name || isNaN(watts) || watts <= 0) {
				showToast('⚠️ Ingresa nombre y watts válidos');
				return;
			}

			const newDevice = {
				id: Date.now().toString(),
				name: name,
				watts: watts,
				qty: 1,
				hours: 4
			};

			state.devices.push(newDevice);
			saveState();
			renderList();
			calculate();
			showToast('✅ Equipo agregado');

			// Reset form
			el.newDeviceName.value = '';
			el.newDeviceWatts.value = '';
			el.newDeviceType.value = '';
		}

		// Eliminar Dispositivo
		function removeDevice(id) {
			state.devices = state.devices.filter(d => d.id !== id);
			saveState();
			renderList();
			calculate();
		}

		// Actualizar Dispositivo
		function updateDevice(id, field, value) {
			const device = state.devices.find(d => d.id === id);
			if (device) {
				device[field] = value;
				saveState();
				calculate();
				// No re-render to keep focus
			}
		}

		// Renderizar Lista
		function renderList() {
			el.deviceList.innerHTML = '';
			
			if (state.devices.length === 0) {
				el.deviceList.innerHTML = '<div class="empty-state">No hay equipos agregados. ¡Agrega uno arriba! 👆</div>';
				return;
			}

			state.devices.forEach(device => {
				const row = document.createElement('div');
				row.className = 'device-row compact-row';
				
				row.innerHTML = `
					<div class="compact-info">
						<div class="compact-name">${device.name}</div>
						<div class="compact-details">${device.watts}W c/u</div>
					</div>
					<div class="compact-controls">
						<div style="text-align: center">
							<label style="font-size: 10px; display: block; color: var(--text-muted)">Cant.</label>
							<input type="number" min="1" value="${device.qty}" class="compact-input qty-input" data-id="${device.id}">
						</div>
						<div style="text-align: center">
							<label style="font-size: 10px; display: block; color: var(--text-muted)">Horas</label>
							<input type="number" min="0" max="24" step="0.5" value="${device.hours}" class="compact-input hours-input" data-id="${device.id}">
						</div>
						<button class="delete-btn" data-id="${device.id}">🗑️</button>
					</div>
				`;
				el.deviceList.appendChild(row);
			});

			// Listeners
			document.querySelectorAll('.qty-input').forEach(inp => {
				inp.addEventListener('input', (e) => updateDevice(e.target.dataset.id, 'qty', parseFloat(e.target.value) || 0));
			});
			document.querySelectorAll('.hours-input').forEach(inp => {
				inp.addEventListener('input', (e) => updateDevice(e.target.dataset.id, 'hours', parseFloat(e.target.value) || 0));
			});
			document.querySelectorAll('.delete-btn').forEach(btn => {
				btn.addEventListener('click', (e) => removeDevice(e.target.closest('.delete-btn').dataset.id));
			});
		}

		// Calcular
		function calculate() {
			state.plantPower = parseInt(el.plantPower.value) || 0;
			state.energyWh = parseInt(el.energyWh.value) || 0;
			state.safety = parseInt(el.safety.value) || 80;

			const maxPower = state.plantPower * (state.safety / 100);
			let totalUsed = 0;
			let weightedEnergyPerDay = 0;

			state.devices.forEach(device => {
				const instantPower = device.watts * device.qty;
				totalUsed += instantPower;
				weightedEnergyPerDay += instantPower * device.hours;
			});

			// Actualizar UI
			el.powerUsed.textContent = `${totalUsed} W`;
			el.powerAvailable.textContent = `${Math.round(maxPower)} W`;

			// Barra de progreso
			const percentage = maxPower > 0 ? (totalUsed / maxPower) * 100 : 0;
			el.powerBar.style.width = Math.min(percentage, 100) + '%';
			el.powerBar.className = 'progress-fill';
			
			if (percentage > 100) {
				el.powerBar.classList.add('danger');
				el.status.textContent = '⚠️ Sobrecarga';
				el.status.className = 'summary-value danger';
			} else if (percentage > 85) {
				el.powerBar.classList.add('warn');
				el.status.textContent = '⚠️ Cerca';
				el.status.className = 'summary-value warn';
			} else {
				el.status.textContent = '✅ OK';
				el.status.className = 'summary-value ok';
			}

			// Tiempo estimado
			if (state.energyWh > 0 && weightedEnergyPerDay > 0) {
				const days = state.energyWh / weightedEnergyPerDay;
				const hours = days * 24;
				
				if (hours < 1) {
					el.timeEstimate.textContent = Math.round(hours * 60) + ' min';
				} else if (hours < 48) {
					el.timeEstimate.textContent = hours.toFixed(1) + ' h';
				} else {
					el.timeEstimate.textContent = days.toFixed(1) + ' días';
				}
			} else {
				el.timeEstimate.textContent = '-- h';
			}
		}

		// Perfiles
		function applyProfile(type) {
			if (type === 'clear') {
				if(confirm('¿Borrar todos los equipos?')) {
					state.devices = [];
					saveState();
					renderList();
					calculate();
					showToast('🧹 Todo limpio');
				}
				return;
			}

			let newDevices = [];
			if (type === 'basic') {
				newDevices = [
					{ id: Date.now() + '1', name: 'Bombillos LED', watts: 10, qty: 5, hours: 6 },
					{ id: Date.now() + '2', name: 'Router WiFi', watts: 12, qty: 1, hours: 24 },
					{ id: Date.now() + '3', name: 'Cargador Celular', watts: 15, qty: 2, hours: 4 }
				];
				showToast('✅ Perfil Básico aplicado');
			} else if (type === 'home') {
				newDevices = [
					{ id: Date.now() + '1', name: 'Bombillos LED', watts: 10, qty: 8, hours: 6 },
					{ id: Date.now() + '2', name: 'Nevera', watts: 150, qty: 1, hours: 24 },
					{ id: Date.now() + '3', name: 'TV', watts: 100, qty: 1, hours: 4 },
					{ id: Date.now() + '4', name: 'Ventilador', watts: 50, qty: 2, hours: 8 },
					{ id: Date.now() + '5', name: 'Router WiFi', watts: 12, qty: 1, hours: 24 }
				];
				showToast('✅ Perfil Casa aplicado');
			}
			
			state.devices = [...state.devices, ...newDevices];
			saveState();
			renderList();
			calculate();
		}

		// Event listeners
		document.getElementById('themeBtn').addEventListener('click', toggleTheme);
		document.getElementById('resetBtn').addEventListener('click', () => {
			if (confirm('¿Reiniciar todo?')) {
				state = { plantPower: 600, energyWh: 0, safety: 80, devices: [] };
				el.plantPower.value = 600;
				el.energyWh.value = 0;
				el.safety.value = 80;
				saveState();
				renderList();
				calculate();
				showToast('🔄 Reiniciado');
			}
		});
		document.getElementById('profileBasic').addEventListener('click', () => applyProfile('basic'));
		document.getElementById('profileHome').addEventListener('click', () => applyProfile('home'));
		document.getElementById('profileClear').addEventListener('click', () => applyProfile('clear'));
		
		el.addDeviceBtn.addEventListener('click', addDevice);

		el.plantPower.addEventListener('input', calculate);
		el.energyWh.addEventListener('input', calculate);
		el.safety.addEventListener('input', calculate);

		// Prevenir zoom en doble tap (iOS)
		let lastTouchEnd = 0;
		document.addEventListener('touchend', (e) => {
			const now = Date.now();
			if (now - lastTouchEnd <= 300) {
				e.preventDefault();
			}
			lastTouchEnd = now;
		}, false);

		// Inicializar
		loadTheme();
		loadState();
		initSelect();
		el.plantPower.value = state.plantPower;
		el.energyWh.value = state.energyWh;
		el.safety.value = state.safety;
		renderList();
		calculate();
	</script>
</body>
</html>
